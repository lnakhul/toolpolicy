[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolpolicy"
version = "0.1.0"
description = "Deterministic runtime authorization for AI-agent tool calls."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Kyle Nakhul" }]
dependencies = ["pydantic>=2.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolpolicy"]