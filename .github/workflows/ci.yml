name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting and lint
        run: |
          ruff format --check .
          ruff check .

      - name: Run tests
        run: pytest -q

      - name: Check allowed example action
        run: |
          toolpolicy check \
            --policy examples/banking-agent/policy.yaml \
            --tool get_customer

      - name: Check approval-required example action
        run: |
          set +e
          toolpolicy check \
            --policy examples/banking-agent/policy.yaml \
            --tool freeze_card
          exit_code=$?
          set -e
          test "$exit_code" -eq 11

      - name: Check denied example action
        run: |
          set +e
          toolpolicy check \
            --policy examples/banking-agent/policy.yaml \
            --tool transfer_funds \
            --arg amount=7500
          exit_code=$?
          set -e
          test "$exit_code" -eq 10